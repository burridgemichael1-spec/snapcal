<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>RustOps Control Center</title>
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/styles/style.css" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <header class="border-b border-slate-800 sticky top-0 z-10 bg-slate-950/95 backdrop-blur">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between gap-4">
      <div>
        <h1 class="text-2xl font-bold">RustOps Control Center</h1>
        <p class="text-sm text-slate-400">Multi-server Rust administration over RCON</p>
      </div>
      <div class="flex gap-2">
        <button id="addServerBtn" class="btn-primary">+ Add Server</button>
        <button id="refreshAllBtn" class="btn-secondary">Refresh</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-4 grid lg:grid-cols-[320px_1fr] gap-4">
    <aside class="panel p-3">
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-semibold">Servers</h2>
        <span id="serverCount" class="text-xs text-slate-400">0</span>
      </div>
      <ul id="serverList" class="space-y-2"></ul>
      <div class="mt-3 text-xs text-slate-500">Tip: store read-only RCON passwords on shared hosts.</div>
    </aside>

    <section class="space-y-4">
      <div class="panel p-4">
        <div class="flex flex-wrap items-center gap-3 justify-between">
          <div>
            <h2 id="activeServerName" class="text-xl font-semibold">No server selected</h2>
            <div id="activeServerMeta" class="text-sm text-slate-400">Select or add a server to begin.</div>
          </div>
          <div class="flex gap-2">
            <button id="connectBtn" class="btn-primary" disabled>Connect</button>
            <button id="disconnectBtn" class="btn-secondary" disabled>Disconnect</button>
          </div>
        </div>
      </div>

      <div class="grid md:grid-cols-4 gap-3" id="kpiGrid"></div>

      <div class="panel p-4">
        <div class="border-b border-slate-800 mb-4">
          <nav class="flex flex-wrap gap-2 pb-3" id="tabs"></nav>
        </div>
        <div id="tabContent"></div>
      </div>
    </section>
  </main>

  <div id="serverModal" class="modal hidden">
    <div class="modal-box max-w-xl">
      <h3 class="text-lg font-semibold mb-3">Server Profile</h3>
      <div class="grid md:grid-cols-2 gap-3">
        <label class="grid gap-1"><span class="text-sm text-slate-300">Name</span><input id="srvName" class="input" /></label>
        <label class="grid gap-1"><span class="text-sm text-slate-300">Host</span><input id="srvHost" class="input" placeholder="127.0.0.1" /></label>
        <label class="grid gap-1"><span class="text-sm text-slate-300">Port</span><input id="srvPort" type="number" class="input" value="28016" /></label>
        <label class="grid gap-1"><span class="text-sm text-slate-300">RCON Password</span><input id="srvPassword" type="password" class="input" /></label>
        <label class="grid gap-1 md:col-span-2"><span class="text-sm text-slate-300">Plugin update feed (optional)</span><input id="srvFeed" class="input" placeholder="https://umod.org/plugins.json" /></label>
      </div>
      <div class="flex gap-2 mt-4">
        <button id="saveServerBtn" class="btn-primary flex-1">Save</button>
        <button id="cancelServerBtn" class="btn-secondary flex-1">Cancel</button>
      </div>
    </div>
  </div>

  <script type="module" src="/scripts/main.js"></script>
</body>
</html>
